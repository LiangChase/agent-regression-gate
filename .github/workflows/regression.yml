name: Agent behavior regression gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demonstrate_regression:
        description: Run the intentional AIR-15 violation (this workflow run will fail by design)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deterministic-gate:
    name: Critical behavior rules (offline fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Gate
        run: uv sync --locked --dev
      - name: Run unit tests
        run: uv run --no-sync pytest -q
      - name: Build the Web console
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Validate cases and configuration
        run: |
          uv run gate --config config/gate.example.yaml config-check
          uv run gate --config config/gate.example.yaml validate-cases --json
      - name: Start deterministic ChatKit fixture
        run: |
          python scripts/ci_mock_sut.py > /tmp/gate-mock-sut.log 2>&1 &
          echo $! > /tmp/gate-mock-sut.pid
          python - <<'PY'
          import time, urllib.error, urllib.request
          for attempt in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1) as response:
                      if response.status == 200:
                          break
              except (OSError, urllib.error.URLError):
                  time.sleep(0.5)
          else:
              raise SystemExit("CI fixture failed to become healthy")
          PY
      - name: Run full deterministic suite
        env:
          GATE_SUT_BASE_URL: http://127.0.0.1:8000
          GATE_SUT_REVISION: deterministic-chatkit-fixture-v1
          GATE_MODEL_EXECUTION_MODE: deterministic
        run: uv run gate --config config/gate.example.yaml run --fail-on critical --output reports/ci/pass
      - name: Prove an unauthorized tool call blocks
        env:
          GATE_SUT_BASE_URL: http://127.0.0.1:8001
          GATE_SUT_REVISION: deterministic-chatkit-fixture-v1
          GATE_MODEL_EXECUTION_MODE: deterministic
        run: |
          uv run gate --config config/gate.example.yaml --sut-base-url http://127.0.0.1:8000 run --case AIR-15 --output reports/ci/air15-pass
          uv run gate --config config/gate.example.yaml baseline save --report reports/ci/air15-pass.json --name ci-air15 --reason "Deterministic fixture pass used for the intentional AIR-15 regression demo"
          GATE_CI_DEMO_REGRESSION=1 GATE_MOCK_SUT_PORT=8001 python scripts/ci_mock_sut.py > /tmp/gate-mock-regression.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(40):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=1).read()
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("Regression fixture failed to become healthy")
          PY
          set +e
          uv run gate --config config/gate.example.yaml run --case AIR-15 --output reports/ci/blocked
          result=$?
          set -e
          if [ "$result" -ne 1 ]; then
            echo "Expected a behavioral gate failure (exit 1), got $result"
            exit 1
          fi
          uv run gate --config config/gate.example.yaml compare --baseline ci-air15 --current reports/ci/blocked.json --output reports/ci/diff
          echo "Expected block reproduced: AIR-15 rejected an unallowlisted tool call."
      - name: Write job summary
        if: always()
        run: |
          if [ -f reports/ci/pass.md ]; then
            cat reports/ci/pass.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/ci/blocked.md ]; then
            echo '## Intentional block demonstration' >> "$GITHUB_STEP_SUMMARY"
            cat reports/ci/blocked.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports and fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-regression-gate-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/ci/
            reports/traces/
            /tmp/gate-mock-sut.log
            /tmp/gate-mock-regression.log

  intentional-block-demo:
    name: Intentional regression (expected red)
    if: ${{ inputs.demonstrate_regression }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install Gate
        run: uv sync --locked --no-dev
      - name: Start fixture with unallowlisted tool regression
        run: |
          GATE_CI_DEMO_REGRESSION=1 python scripts/ci_mock_sut.py > /tmp/gate-intentional-block.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(40):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1).read()
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("Intentional-block fixture failed to become healthy")
          PY
      - name: Run AIR-15 and fail the job on the injected regression
        env:
          GATE_SUT_BASE_URL: http://127.0.0.1:8000
          GATE_SUT_REVISION: deterministic-chatkit-fixture-v1
          GATE_MODEL_EXECUTION_MODE: deterministic
        run: uv run gate --config config/gate.example.yaml run --case AIR-15 --output reports/ci/intentional-block
      - name: Upload intentional failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intentional-regression-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/ci/intentional-block*
            reports/traces/
            /tmp/gate-intentional-block.log
