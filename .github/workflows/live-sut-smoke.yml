name: Live SUT smoke (manual, paid API)

on:
  workflow_dispatch:
    inputs:
      run_live_sut:
        description: Run AIR-01 against the pinned airline SUT using DeepSeek API
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ inputs.run_live_sut }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned SUT revision
        id: sut-lock
        run: |
          REVISION=$(awk '/^[[:space:]]*revision:/{print $2; exit}' config/sut.lock.yaml | tr -d '\r')
          test -n "$REVISION" || (echo "config/sut.lock.yaml is missing a pinned revision" && exit 1)
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned SUT from the project repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.sut-lock.outputs.revision }}
          path: sut
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Require configured DeepSeek secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: test -n "$DEEPSEEK_API_KEY" || (echo "Set repository secret DEEPSEEK_API_KEY before enabling the paid smoke." && exit 1)
      - name: Install Gate and pinned SUT dependencies
        run: |
          uv sync --locked --no-dev
          python -m pip install -r sut/python-backend/requirements.txt
      - name: Start pinned SUT
        env:
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          AGENT_RESPONSE_LANGUAGE: zh-CN
        working-directory: sut/python-backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/sut.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sut.pid"
          python - <<'PY'
          import time, urllib.request
          for _ in range(90):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Pinned SUT did not become healthy")
          PY
      - name: Run live smoke case
        env:
          GATE_SUT_BASE_URL: http://127.0.0.1:8000
          GATE_SUT_REVISION: ${{ steps.sut-lock.outputs.revision }}
          GATE_MODEL_EXECUTION_MODE: live
          GATE_MODEL_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run gate --config config/gate.example.yaml run --case AIR-01 --output reports/live-sut/AIR-01
      - name: Upload live smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sut-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/live-sut/
            ${{ runner.temp }}/sut.log
